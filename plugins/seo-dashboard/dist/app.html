<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      /* Shared basics (body, .row, .stack, .empty, .status, table) come from src/core/app/base.css. */
      :root {
        --brand: #2456c9; --brand-text: #1f4fb8; --brand-soft: color-mix(in srgb, #2456c9 9%, transparent);
        /* Series: you, competitor 1, competitor 2 (validated categorical order). */
        --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s-other: #b9b8b1;
        --ink-2: #52514e; --ink-3: #898781; --grid: #e1e0d9;
        --up: #1a7f4b; --down: #c4352b;
        --critical: #c4352b; --warning: #a86300; --notice: #52514e; --good: #1a7f4b;
        --panel: color-mix(in srgb, var(--foreground) 3%, var(--background));
        --hover: color-mix(in srgb, var(--foreground) 5%, transparent);
      }
      :root[data-theme="dark"] {
        --brand: #3d6fe0; --brand-text: #8fb0f5; --brand-soft: color-mix(in srgb, #6c95f0 16%, transparent);
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-other: #5f5e59;
        --ink-2: #c3c2b7; --ink-3: #898781; --grid: #2c2c2a;
        --up: #4cc38a; --down: #ff7b6e;
        --critical: #ff7b6e; --warning: #f0b45a; --notice: #c3c2b7; --good: #4cc38a;
      }
      html body { padding: 0; }
      button { font: inherit; color: inherit; }
      .btn.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      .btn.btn-primary:not(:disabled):hover { background: color-mix(in srgb, var(--brand) 86%, #000); }
      .muted { color: var(--muted-foreground); }
      .small { font-size: 12px; }
      .num { font-variant-numeric: tabular-nums; }
      .link { background: none; border: 0; padding: 0; color: var(--brand-text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
      .icon-btn { border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--muted-foreground); line-height: 1; }
      .icon-btn:hover { background: var(--hover); color: var(--foreground); }
      .banner { padding: 8px 10px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--critical) 10%, transparent); color: var(--critical); }
      .note { padding: 8px 10px; border-radius: 8px; font-size: 12px; background: var(--panel); color: var(--muted-foreground); }
      code { font: 12px var(--font-mono, ui-monospace, Menlo, monospace); }

      .app { padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
      .box { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--background); }
      .box h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
      .box h2 .spacer { flex: 1; }

      /* ------------------------------------------------------------- header */
      .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .logo { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; }
      .top-text { min-width: 0; flex: 1; }
      .top-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; min-width: 0; }
      .top-title select { max-width: 100%; font-weight: 600; font-size: 15px; border: 0; background: none; padding: 0 18px 0 0; color: inherit; cursor: pointer; text-overflow: ellipsis; }
      .top-sub { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); margin: 0 -14px; padding: 0 10px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { border: 0; background: none; padding: 7px 9px 8px; cursor: pointer; color: var(--muted-foreground); font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
      .tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--brand); font-weight: 600; }
      .tab .count { font-size: 11px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); }

      /* ------------------------------------------------------------ overview */
      .overview { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 720px) { .overview { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } .overview .wide { grid-column: 1; } }
      .hero { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
      .hero-num { font-size: 34px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .hero-label { font-size: 12px; color: var(--muted-foreground); }
      .delta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted-foreground); }
      .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
      .kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .kpi { padding: 8px 10px; border-radius: 8px; background: var(--panel); min-width: 0; }
      .kpi b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
      .kpi span { display: block; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @media (max-width: 360px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      /* Search Console report: the metric tiles pick the chart's metric. */
      button.kpi.metric { border: 1px solid transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; }
      button.kpi.metric:hover { border-color: var(--border); }
      button.kpi.metric[aria-pressed="true"] { border-color: var(--s1); box-shadow: inset 0 -2px 0 var(--s1); }
      button.kpi.metric .d { margin-top: 2px; }
      @media (max-width: 480px) { .kpis.metric-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      table.gsc-table td:first-child { max-width: 0; width: 60%; }
      table.gsc-table .track { visibility: hidden; }
      table.gsc-table tr:hover .track, table.gsc-table .track:focus-visible { visibility: visible; }
      @media (hover: none) { table.gsc-table .track { visibility: visible; } }
      table.gsc-table .tag { font-size: 11px; padding: 0 7px; background: var(--muted); color: var(--ink-2); }
      .opps li { grid-template-columns: minmax(0, 1fr) auto 44px; }
      .opps li > :last-child { justify-self: end; }
      /* Search Console report: the metric tiles pick the chart's metric. */
      button.kpi.metric { border: 1px solid transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; }
      button.kpi.metric:hover { border-color: var(--border); }
      button.kpi.metric[aria-pressed="true"] { border-color: var(--s1); background: var(--background, transparent); box-shadow: inset 0 -2px 0 var(--s1); }
      button.kpi.metric .d { margin-top: 2px; }
      @media (max-width: 480px) { .kpis.metric-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      table.gsc-table td:first-child { max-width: 0; width: 60%; }
      table.gsc-table .track { visibility: hidden; }
      table.gsc-table tr:hover .track, table.gsc-table .track:focus-visible { visibility: visible; }
      @media (hover: none) { table.gsc-table .track { visibility: visible; } }
      table.gsc-table .tag { font-size: 11px; padding: 0 7px; background: var(--muted); color: var(--ink-2); }
      .opps li { grid-template-columns: minmax(0, 1fr) auto 44px; }
      .opps li > :last-child { justify-self: end; }

      .refresh { display: flex; flex-direction: column; gap: 8px; }
      .refresh.highlight { outline: 2px solid var(--brand); outline-offset: -1px; }
      .refresh .btn { justify-content: center; }
      .runline { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .seg button { border: 0; background: none; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted-foreground); }
      .seg button[aria-pressed="true"] { background: var(--muted); color: var(--foreground); font-weight: 600; }
      .movers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
      .movers li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .movers li:first-child { border-top: 0; }
      .movers .term { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
      .movers .term:hover { text-decoration: underline; }
      .ai { display: flex; flex-direction: column; gap: 6px; }
      .ai .btn { justify-content: flex-start; text-align: left; }
      .health { display: flex; align-items: center; gap: 8px; font-size: 13px; }

      /* ------------------------------------------------------------ status labels */
      .sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .sev.critical { color: var(--critical); } .sev.warning { color: var(--warning); } .sev.notice { color: var(--notice); } .sev.good { color: var(--good); }

      /* ------------------------------------------------------------ keywords */
      .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .toolbar .form-control { flex: 1; min-width: 140px; min-height: 32px; }
      .chips { display: flex; gap: 4px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--border); background: none; border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer; color: var(--muted-foreground); }
      .chip[aria-pressed="true"] { background: var(--brand-soft); border-color: transparent; color: var(--brand-text); font-weight: 600; }
      .table-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
      table.kw { font-size: 13px; }
      table.kw th { font-size: 11px; font-weight: 600; color: var(--muted-foreground); white-space: nowrap; cursor: pointer; user-select: none; padding: 6px; }
      table.kw th[aria-sort] { color: var(--foreground); }
      table.kw td { padding: 7px 6px; vertical-align: middle; }
      table.kw tbody tr { cursor: pointer; }
      table.kw tbody tr:hover td { background: var(--hover); }
      table.kw tr[aria-selected="true"] td { background: var(--brand-soft); }
      table.kw .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .kw-term { font-weight: 500; overflow-wrap: anywhere; }
      .kw-url { font-size: 11px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
      .pos { font-weight: 600; font-variant-numeric: tabular-nums; }
      .pos.none { font-weight: 400; color: var(--muted-foreground); font-size: 12px; }
      .d { font-size: 12px; font-variant-numeric: tabular-nums; }
      .d.up { color: var(--up); } .d.down { color: var(--down); } .d.flat { color: var(--ink-3); }
      .col-30, .col-best, .col-comp { display: none; }
      @media (min-width: 560px) { .col-30, .col-best { display: table-cell; } }
      @media (min-width: 760px) { .col-comp { display: table-cell; } }
      @media (max-width: 420px) { .col-spark { display: none; } }
      .col-impr { display: none; }
      @media (min-width: 560px) { .col-impr { display: table-cell; } }
      table.kw th.gsc, table.kw td.gsc { color: var(--ink-2); }
      table.kw thead th.gsc-first, table.kw td.gsc-first { border-left: 1px solid var(--border); }
      .tagline { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
      .tagline .tag, .tags .tag { background: var(--muted); color: var(--ink-2); }
      .tagline .tag { font-size: 11px; padding: 0 7px; }

      /* ------------------------------------------------------------ charts */
      .chart { position: relative; }
      .chart-plot { position: relative; }
      .chart-svg { display: block; overflow: visible; }
      .chart-grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
      .chart-axis { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
      .chart-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .chart-dot { stroke: var(--background); stroke-width: 2; }
      .chart-cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
      .chart-tip { position: absolute; pointer-events: none; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); min-width: 140px; }
      .tip-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 6px; align-items: center; color: var(--ink-2); }
      .tip-row b { color: var(--foreground); font-variant-numeric: tabular-nums; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
      .legend-item { display: inline-flex; align-items: center; gap: 5px; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); }
      .swatch.dashed { height: 2px; border-radius: 0; background: linear-gradient(90deg, var(--c) 0 40%, transparent 40% 60%, var(--c) 60%); }
      .chart-line.dashed { stroke-dasharray: 5 4; stroke-width: 1.75; }
      .spark { display: block; }
      .spark-line { fill: none; stroke: var(--s1); stroke-width: 1.5; stroke-linejoin: round; }
      .spark-dot { fill: var(--s1); }
      .bars { display: flex; flex-direction: column; gap: 6px; }
      .bar-row { display: grid; grid-template-columns: minmax(80px, 46%) minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 12px; }
      .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { height: 10px; border-radius: 4px; background: var(--panel); overflow: hidden; }
      .bar-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
      .bar-value { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

      /* ------------------------------------------------------------ keyword detail */
      .detail { display: flex; flex-direction: column; gap: 10px; }
      .detail-head { display: flex; align-items: flex-start; gap: 8px; }
      .detail-head h3 { margin: 0; font-size: 15px; flex: 1; overflow-wrap: anywhere; }
      .serp { list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
      .serp li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
      .serp li.you { font-weight: 600; }
      .serp .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .serp .u { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .two { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 720px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

      /* ------------------------------------------------------------ lists */
      .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
      .rows > li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .rows > li:first-child { border-top: 0; padding-top: 0; }
      .rows .meta { font-size: 12px; color: var(--muted-foreground); }
      .kv { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
      .issue { display: flex; gap: 8px; align-items: baseline; margin-top: 4px; font-size: 12px; }

      /* ------------------------------------------------------------ forms */
      .form { display: flex; flex-direction: column; gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .field > span { font-size: 12px; font-weight: 600; }
      .field small { font-size: 11px; color: var(--muted-foreground); }
      .grid2 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
      textarea.form-control { min-height: 84px; font: inherit; }

      /* ------------------------------------------------------------ setup */
      .setup { max-width: 640px; margin: 0 auto; width: 100%; }
      .setup-hero { display: flex; gap: 12px; align-items: center; }
      .setup-hero h1 { font-size: 18px; margin: 0; }
      .setup-hero p { margin: 2px 0 0; }
      .modes { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 560px) { .modes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
      .mode { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; background: none; }
      .mode[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
      .mode b { font-size: 13px; }
      .token-form { display: flex; gap: 8px; }
      .token-form .form-control { flex: 1; min-width: 0; font-family: var(--font-mono, ui-monospace, Menlo, monospace); }
      .token-form.stacked { flex-direction: column; align-items: flex-start; }
      .token-form.stacked .form-control { width: 100%; }
      /* The pasted key isn't shown on screen. */
      .key-input { min-height: 60px; resize: vertical; -webkit-text-security: disc; font-size: 12px; }
      .steps { margin: 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
      .email { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12px; overflow-wrap: anywhere; }
      .queries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
      .queries li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .queries li:first-child { border-top: 0; }
      .queries .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      pre.plan { margin: 0; padding: 8px 10px; max-height: 150px; overflow: auto; border-radius: 8px; background: var(--panel); font: 11px/1.45 var(--font-mono, ui-monospace, Menlo, monospace); }
    </style>
  </head>

    <p id="boot" class="empty text-muted">Loading SEO Dashboard…</p>
    <main id="app" class="app" hidden></main>
